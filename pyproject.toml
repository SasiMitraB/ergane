[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ergane"
version = "0.1.0"
description = "A lightweight Athena++ / AthenaK simulation analysis and visualization toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
interactive = [
    "fastplotlib",
    "ipywidgets",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["ergane*"]
